[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 comes with object_store 0.13 and only parses the operator's own store's responses; object_store 0.14 fixes it" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39 comes with object_store 0.13 and only parses the operator's own store's responses; object_store 0.14 fixes it" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "zlib-acknowledgement",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
