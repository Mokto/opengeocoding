[package]
name = "opengeocoding"
version = "0.16.0"
edition = "2024"
# PolyForm Shield 1.0.0 has no SPDX identifier.
license-file = "LICENSE"
description = "Address resolution with libpostal, Overture indexes, Connect and gRPC"
repository = "https://github.com/Mokto/opengeocoding"
rust-version = "1.99"

[dependencies]
anyhow = "1"
axum = "0.8"
buffa = "0.9"
connectrpc = { version = "0.9", features = ["axum"] }
deunicode = "1.6"
connectrpc-reflection = { version = "0.9", default-features = false }
indexmap = { version = "2", features = ["serde"] }
prometheus = "0.14"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = { version = "0.17", default-features = false }
rustpostal = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sentry = { version = "0.42", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "fs", "io-util", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tantivy = "0.26"
tantivy-fst = "0.5"
levenshtein_automata = "0.2"
rstar = "0.13"
rayon = "1"
arrow-array = "60"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap"] }
mimalloc = { version = "0.1", default-features = false }
osmpbf = "0.3"
flate2 = "1"
object_store = { version = "0.13.2", default-features = false, features = ["aws", "fs"] }
# The leader binary (src/bin/leader).
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", features = ["v1_36"] }

[build-dependencies]
ring = { version = "0.17", default-features = false }
connectrpc-build = "0.9"
deunicode = "1.6"
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

# CodSpeed's profiles need symbols.
[profile.bench]
strip = false
debug = true

[dev-dependencies]
arrow-schema = "60"
divan = { package = "codspeed-divan-compat", version = "5.0.2" }

[[bench]]
name = "index"
harness = false

[[bench]]
name = "matching"
harness = false

[[bench]]
name = "resolve"
harness = false
