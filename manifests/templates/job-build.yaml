{{- if .Values.build.enabled }}
{{- $id := include "og.indexId" . }}
apiVersion: batch/v1
kind: Job
metadata:
  # A Job's pod template can't change: any change to the build settings is a new Job, which
  # exits at once if its index is already published.
  name: {{ include "og.name" . }}-build-{{ printf "%s %s %s" $id (include "og.image" .) (toJson .Values.build) | sha256sum | trunc 10 }}
  labels:
    {{- include "og.labels" . | nindent 4 }}
    app.kubernetes.io/component: build
  annotations:
    opengeocoding.io/index: {{ $id | quote }}
spec:
  backoffLimit: {{ .Values.build.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.build.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "og.labels" . | nindent 8 }}
        app.kubernetes.io/component: build
      {{- with .Values.build.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "og.serviceAccount" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "og.podSecurity" . | nindent 8 }}
      containers:
        - name: build
          image: {{ include "og.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - build_index
            - job
            - --store
            - {{ required "store.url is required" .Values.store.url | quote }}
            - --index
            - {{ $id | quote }}
            - --builder-hash
            - {{ .Values.index.builderHash | quote }}
            - --sources
            - /config/sources.json
            - --scratch
            - /scratch
            - --models
            - /scratch/libpostal
            - --models-version
            - {{ .Values.index.modelsVersion | quote }}
          env:
            {{- include "og.storeEnv" . | nindent 12 }}
          {{- with .Values.store.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          resources:
            {{- toYaml .Values.build.resources | nindent 12 }}
          securityContext:
            {{- include "og.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: scratch
              mountPath: /scratch
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "og.name" . }}-sources
        - name: data
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir: {}
        - name: scratch
          {{- if .Values.build.scratch.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.build.scratch.existingClaim | quote }}
          {{- else if .Values.build.scratch.emptyDir }}
          emptyDir:
            sizeLimit: {{ .Values.build.scratch.size }}
          {{- else }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                {{- with .Values.build.scratch.storageClassName }}
                storageClassName: {{ . }}
                {{- end }}
                resources:
                  requests:
                    storage: {{ .Values.build.scratch.size }}
          {{- end }}
      {{- with .Values.build.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.build.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.build.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
