build:
  enabled: true
  backoffLimit: 4
  # A world build fetches about 140 GB the first time.
  activeDeadlineSeconds: 172800
  resources:
    requests:
      cpu: "16"
      memory: 24Gi
    limits:
      memory: 32Gi
  # Sources, the house-number spill and the output: about 160 GB for the world. A volume
  # claimed for the pod from storageClassName (the default class when empty), or an emptyDir.
  scratch:
    size: 250Gi
    storageClassName: ""
    emptyDir: false
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

serving:
  replicas: 2
  resources:
    requests:
      cpu: "1"
      memory: 6Gi
    # The memory-mapped index's page cache counts against this limit: 16Gi keeps a world index
    # (12 GB) cached; less works, with slower uncommon lookups.
    limits:
      memory: 16Gi
  # emptyDir for the pulled index (12 GB for the world) and models (2 GB).
  indexVolumeSize: 20Gi
  # A first install waits for the build; its rollout stays in progress until then.
  progressDeadlineSeconds: 172800
  env: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

service:
  type: ClusterIP
  port: 11121
  metricsPort: 8000
  annotations: {}

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
