image:
  repository: ghcr.io/mokto/opengeocoding
  # Defaults to the chart's appVersion. The image must come from the commit whose builder hash
  # is index.builderHash: the build Job refuses any other.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Where sources, models and built indexes are kept: any S3-compatible store. Credentials and
# settings reach the pods as the standard AWS_* variables.
store:
  # Required: s3://bucket/optional/prefix
  url: ""
  # For stores other than AWS S3, such as http://minio.minio:9000
  endpoint: ""
  region: us-east-1
  # Required for an http:// endpoint.
  allowHttp: false
  # Path-style requests (bucket in the path) work with most S3-compatible stores.
  virtualHostedStyle: false
  # Secret holding AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (and optionally
  # AWS_SESSION_TOKEN). The build Job writes with it.
  credentialsSecret: ""
  # Read-only credentials for the serving pods; defaults to credentialsSecret.
  readCredentialsSecret: ""
  # More AWS_* variables, for example AWS_ROLE_ARN with a projected web identity token.
  extraEnv: []

serviceAccount:
  create: false
  # Defaults to the release name when created, else the namespace's default account.
  name: ""
  # For example eks.amazonaws.com/role-arn, to reach the store without static keys.
  annotations: {}

index:
  # The hash of the index builder this chart was released with (`build_index hash`); `cargo
  # test` fails when the code and this disagree. Changing it, or anything under sources or
  # modelsVersion, names a new index: the build Job builds it while the running pods keep
  # serving the old one.
  builderHash: "f95ab5b87bc62f79"
  modelsVersion: v1
  sources:
    overtureRelease: "2026-09-23.1"
    # Labels one fetch of the sources that only publish "latest" (OSM, OpenAddresses, GeoNames).
    # A new label fetches them again.
    snapshot: "2026-10"
    # [min lon, min lat, max lon, max lat] to build a regional index; empty for the world.
    # Overture is then read only where its row groups meet the box.
    bbox: []
    # OpenAddresses layers that Overture doesn't carry. Only files whose licence is recognised
    # as open or ODbL are read unless anyLicence; see the README.
    openaddresses:
      enabled: true
      anyLicence: false
    # GeoNames postal-code exports; earlier entries win for a postcode several define.
    geonamesPostal:
      - GB_full.csv
      - CA_full.csv
      - NL_full.csv
      - allCountries
    # Geofabrik extract ids (see https://download.geofabrik.de/index-v1-nogeom.json), for
    # countries Overture's addresses miss or cover thinly.
    osm:
      - afghanistan
      - albania
      - algeria
