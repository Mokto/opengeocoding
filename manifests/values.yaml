# The leader (src/bin/leader): builds the index when the store lacks it, then rolls the serving
# Deployment out to it. The bucket must exist: the leader exits when it can't list it.
leader:
  replicas: 2
  intervalSeconds: 30
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

build:
  # false: the leader never builds, and serves an index only once something else has published it.
  enabled: true
  # The Job never retries its pod; the leader replaces a failed Job after this many seconds.
  retryDelaySeconds: 600
  # A world build fetches about 200 GB the first time.
  activeDeadlineSeconds: 172800
  resources:
    requests:
      cpu: "16"
      memory: 24Gi
    limits:
      memory: 32Gi
  # Sources, the house-number spill and the output: about 220 GB for the world. A volume
  # claimed for the pod from storageClassName (the default class when empty), an emptyDir, or
  # an existing claim (the others are deleted with the pod). A claim that outlives the Job keeps
  # the sources already copied from the store, so the next build re-downloads only what changed
  # and deletes the files its sources no longer name;
  # files are reused only when their size and SHA-256 match the store's MANIFEST. The claim must
  # hold `size` and be ReadWriteOnce at least, and it pins the pod to the volume's node or zone.
  scratch:
    size: 250Gi
    storageClassName: ""
    emptyDir: false
    existingClaim: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

serving:
  replicas: 2
  resources:
    requests:
      cpu: "1"
      memory: 6Gi
    # The memory-mapped index's page cache counts against this limit: 16Gi keeps a world index
    # (12 GB) cached; less works, with slower uncommon lookups.
    limits:
      memory: 16Gi
  # emptyDir for the pulled index (12 GB for the world) and models (2 GB).
  indexVolumeSize: 20Gi
  # The leader creates the Deployment once the index exists; its pods then pull 12 GB.
  progressDeadlineSeconds: 3600
  env: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    # The HPA's scaling behavior (autoscaling/v2). Every new pod pulls the whole index before it
    # serves, so a slow scale-up and a long scale-down window avoid paying that on a short burst.
    behavior: {}
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

service:
  type: ClusterIP
  port: 11121
  metricsPort: 8000
  annotations: {}

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
