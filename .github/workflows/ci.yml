name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      LIBPOSTAL_COMMIT: 25099c506612b34b23b1bfe286ca6321fcf06f35
      LIBPOSTAL_PREFIX: /home/runner/libpostal
      LIBPOSTAL_MODELS: /home/runner/models
      RUSTFLAGS: -L native=/home/runner/libpostal/lib
      LD_LIBRARY_PATH: /home/runner/libpostal/lib
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/libpostal-env
        with:
          models: "true"
      - name: Install Rust and Buf
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy && rustup default 1.99.0
          curl -fsSL --retry 3 "https://github.com/bufbuild/buf/releases/download/v1.68.1/buf-Linux-$(uname -m)" -o "$HOME/.cargo/bin/buf"
          chmod +x "$HOME/.cargo/bin/buf"
      # Only main writes caches: PRs and release tags can read the default branch's entries,
      # and per-PR copies would evict them from the repository's 10 GB quota.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 tests/registry/test-registry-captures.py
      - run: python3 tests/registry/test-nar-prg-exports.py
      # The panel generator's country masks; the version docs/evaluation/global-addresses.md names.
      - run: python3 -m pip install --user --break-system-packages shapely==2.0.7
      - run: python3 tests/global/test-build-addresses.py
      - run: python3 tests/towns/test-sample-towns.py
      - run: python3 .github/scripts/test-gold-nightly-issue.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --bin notices && git diff --exit-code THIRD_PARTY_NOTICES.txt
      - run: python3 tests/registry/test-registry-exports.py
      # Resolves addresses through libpostal over the synthetic world of tests/synthetic.
      - run: cargo test --locked --test synthetic -- --ignored

  runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          load: true
          tags: opengeocoding
          cache-from: type=gha,scope=runtime-${{ matrix.runner }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,ignore-error=true,scope=runtime-{0}', matrix.runner) || '' }}
      - name: Inspect the non-root runtime
        run: |
          test "$(docker image inspect opengeocoding --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/opengeocoding"]'
          docker run --rm --entrypoint sh opengeocoding -ec '
            test "$(id -u)" = 1000
            test ! -e /usr/local/bin/python
            test -x /usr/local/bin/opengeocoding
            test -x /usr/local/bin/build_index
            test -x /usr/local/bin/leader
            test -x /usr/local/bin/libpostal_data
            test ! -e /usr/local/bin/serve_index
            test ! -e /usr/local/bin/geolocation
            ! ldd /usr/local/bin/opengeocoding | grep "not found"
            ! ldd /usr/local/bin/build_index | grep "not found"
            ! ldd /usr/local/bin/leader | grep "not found"
          '
          test "$(docker run --rm --entrypoint build_index opengeocoding hash)" = "$(sed -n 's/^  builderHash: "\(.*\)"$/\1/p' manifests/values.yaml)"

  chart:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        run: |
          curl -fsSLo helm.tgz https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Lint and render the chart
        run: |
          set -- --set store.url=s3://bucket/prefix
          helm lint --strict manifests "$@"
          helm template t manifests "$@" > /dev/null
          helm template t manifests "$@" --set serviceAccount.create=true \
            --set serving.autoscaling.enabled=true --set serviceMonitor.enabled=true \
            --set build.scratch.emptyDir=true --set 'index.sources.bbox={9.47,47.04,9.64,47.28}' > /dev/null
          ! helm template t manifests > /dev/null 2>&1
