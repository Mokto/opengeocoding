name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Only main writes the cache: PRs and release tags can read the default branch's entries,
      # and per-PR copies would evict them from the repository's 10 GB quota.
      - name: Check formatting, lint and regression tests
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: checks
          cache-from: type=gha,scope=checks-${{ matrix.runner }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,ignore-error=true,scope=checks-{0}', matrix.runner) || '' }}
      - name: Build the runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          load: true
          tags: opengeocoding
          cache-from: type=gha,scope=runtime-${{ matrix.runner }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,ignore-error=true,scope=runtime-{0}', matrix.runner) || '' }}
      - name: Inspect the non-root runtime
        run: |
          test "$(docker image inspect opengeocoding --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/opengeocoding"]'
          docker run --rm --entrypoint sh opengeocoding -ec '
            test "$(id -u)" = 1000
            test ! -e /usr/local/bin/python
            test -x /usr/local/bin/opengeocoding
            test -x /usr/local/bin/build_index
            test -x /usr/local/bin/libpostal_data
            test ! -e /usr/local/bin/serve_index
            test ! -e /usr/local/bin/geolocation
            ! ldd /usr/local/bin/opengeocoding | grep "not found"
            ! ldd /usr/local/bin/build_index | grep "not found"
          '
          test "$(docker run --rm --entrypoint build_index opengeocoding hash)" = "$(sed -n 's/^  builderHash: "\(.*\)"$/\1/p' manifests/values.yaml)"

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Install Helm
        run: |
          curl -fsSLo helm.tgz https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Lint and render the chart
        run: |
          set -- --set store.url=s3://bucket/prefix
          helm lint --strict manifests "$@"
          helm template t manifests "$@" > /dev/null
          helm template t manifests "$@" --set serviceAccount.create=true \
            --set serving.autoscaling.enabled=true --set serviceMonitor.enabled=true \
            --set build.scratch.emptyDir=true --set 'index.sources.bbox={9.47,47.04,9.64,47.28}' > /dev/null
          ! helm template t manifests > /dev/null 2>&1
