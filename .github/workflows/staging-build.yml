name: Staging image build

# Builds the evaluation image (the runtime image plus the evaluator and gold corpus) for pull requests, forks included, and for main. It holds no secret
# and no write permission: staging-publish.yml, which runs from the default branch, pushes the
# artifact. The main commits are built too, so that every pull request's merge base has an image.
on:
  pull_request:
    paths:
      - src/**
      - data/**
      - proto/**
      - manifests/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
      - tests/gold*.jsonl
      - tests/registry/**
      - tests/global/**
      - tests/global_addresses.rs
      - .github/workflows/staging-build.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    # release-please's version-bump pull requests change no behavior; skipping the build also
    # skips the full-index gold run that staging-publish.yml starts from it
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify image source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the evaluation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: eval
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          labels: |
            org.opencontainers.image.source=https://github.com/Mokto/opengeocoding
            org.opencontainers.image.licenses=LicenseRef-PolyForm-Shield-1.0.0
          cache-from: type=gha,scope=runtime-${{ matrix.runner }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-image-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 0
