name: Staging image publish

# Runs from the default branch after staging-build.yml, with write access to the staging
# package. The publish job never checks out or runs the pull request's code: it only copies the
# images the build produced, tagged with the commit the build ran for. The images are untrusted:
# run them only in an isolated environment.
#
# Once both are pushed, the gold jobs run the suite on a full index in a private cluster: both
# commits' staging images are evaluated there on the same index, and the report comes back through
# an authenticated endpoint. No code from the pull request runs on GitHub and the cluster holds no
# GitHub credentials; these jobs only send two commit hashes and each one's index sources and
# builder hash. They are in this workflow, not a separate one, because a workflow started by this
# one would see this workflow's event instead of the build's, and a called workflow cannot read an
# environment's secrets.
#
# `prepare` runs without an environment and picks one: pull requests from the team use
# gold-trusted, everything else waits for a reviewer's approval in gold-approval. Both environments
# only accept workflows from main and hold the endpoint key (GOLD_GATEWAY_KEY) and URL
# (GOLD_GATEWAY_URL).
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] see above
    workflows: [Staging image build]
    types: [completed]

permissions: {}

env:
  REPO: ${{ github.repository }}
  IMAGE: ghcr.io/mokto/opengeocoding-staging

jobs:
  publish:
    if: github.repository == 'Mokto/opengeocoding' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: staging-image-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push both architectures and the manifest list
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image=ghcr.io/mokto/opengeocoding-staging
          echo "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          for arch in amd64 arm64; do
            skopeo copy "docker-archive:staging-image-$arch/image.tar" "docker://$image:sha-$SHA-$arch"
          done
          docker buildx imagetools create --tag "$image:sha-$SHA" "$image:sha-$SHA-amd64" "$image:sha-$SHA-arm64"

  prepare:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      head: ${{ steps.pick.outputs.head }}
      base: ${{ steps.pick.outputs.base }}
      pr: ${{ steps.pick.outputs.pr }}
      environment: ${{ steps.pick.outputs.environment }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          status() {
            for context in gold-full gold-speed; do
              gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$1" -f context="$context" \
                -f description="$2" -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" > /dev/null
            done
          }
          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: $1"
            status success "Skipped: $1"
            exit 0
          }
          # The pull request's comment saying why there is no gold run is its own, not the
          # gold-full or gold-speed comments of a run: `explain TEXT` posts or updates it, and
          # `forget` deletes it once a run can start. A green status alone looks like a pass that
          # nobody sees. Best effort, like the run's comments.
          skipped_comment() {
            gh api "repos/$REPO/issues/$pr/comments" --paginate \
              -q '.[] | select(.body | startswith("<!-- gold-status -->")) | .id'
          }
          explain() {
            [ -n "$pr" ] || return 0
            printf '<!-- gold-status -->\n## Gold check and speed, full index: not run\n\n%s\n\nThis comment goes away when a run can start.\n' \
              "$1" > "$RUNNER_TEMP/skipped.md"
            id=$(skipped_comment) || { echo "::warning::Could not read the pull request comments"; return 0; }
            id=${id%%$'\n'*}
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/skipped.md" > /dev/null || echo "::warning::Could not update the comment"
            else
              gh api -X POST "repos/$REPO/issues/$pr/comments" -F body=@"$RUNNER_TEMP/skipped.md" > /dev/null || echo "::warning::Could not post the comment"
            fi
          }
          forget() {
            [ -n "$pr" ] || return 0
            for id in $(skipped_comment || true); do
              gh api -X DELETE "repos/$REPO/issues/comments/$id" > /dev/null || echo "::warning::Could not delete the comment"
            done
          }
          pr=""
          case "$EVENT" in
            push)
              # main's image is built and pushed so later pull requests have a merge base to pull
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::No gold run for a commit already on main; pull requests run their own"
              exit 0 ;;
            pull_request)
              pr=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
                   -q ".[] | select(.head.sha == \"$HEAD_SHA\") | .number")
              pr=${pr%%$'\n'*}
              [ -n "$pr" ] || skip "no open pull request for this commit"
              base=$(gh api "repos/$REPO/compare/main...$HEAD_SHA" -q '.merge_base_commit.sha')
              assoc=$(gh api "repos/$REPO/pulls/$pr" -q '.author_association')
              case "$assoc" in OWNER|MEMBER|COLLABORATOR) environment=gold-trusted ;; *) environment=gold-approval ;; esac ;;
            *) skip "unsupported event $EVENT" ;;
          esac
          for sha in "$HEAD_SHA" "$base"; do
            docker manifest inspect "$IMAGE:sha-$sha" 2>/dev/null \
              | jq -e '[.manifests[].platform.architecture] | contains(["amd64","arm64"])' > /dev/null \
              || {
                if [ "$sha" = "$base" ]; then
                  explain "The run compares this branch with its merge base on \`main\`, \`${sha:0:7}\`, and no staging image was published for that commit, so there is nothing to compare against. Rebase onto the latest \`main\` (\`git fetch origin main && git rebase origin/main && git push --force-with-lease\`), or merge it. If \`main\`'s newest commit is still building its staging image, wait for that first."
                else
                  explain "No staging image was published for this commit, \`${sha:0:7}\`, so it cannot be evaluated. Look at the \`Staging image build\` and \`Staging image publish\` runs for it; pushing a new commit starts both again."
                fi
                skip "no multi-architecture staging image for ${sha:0:7}"
              }
          done
          forget
          {
            echo "head=$HEAD_SHA"
            echo "base=$base"
            echo "pr=$pr"
            echo "environment=$environment"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          status pending "Waiting for the full-index run ($environment)"

  gold:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-26.04
    environment: ${{ needs.prepare.outputs.environment }}
    # A first build of the full index takes hours and can outlast this limit; the run then keeps
    # going in the cluster and a later run reuses its index.
    timeout-minutes: 350
    concurrency:
      group: gold-full-${{ needs.prepare.outputs.pr || needs.prepare.outputs.head }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      HEAD_SHA: ${{ needs.prepare.outputs.head }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
      PR: ${{ needs.prepare.outputs.pr }}
      URL: ${{ vars.GOLD_GATEWAY_URL }}
      KEY: ${{ secrets.GOLD_GATEWAY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the run
        run: | # zizmor: ignore[github-env] through setenv
          set -euo pipefail
          # Comment updates are best effort; a failed one never fails the run.
          cat > "$RUNNER_TEMP/lib.sh" <<'LIB'
          PHASES="$RUNNER_TEMP/phases.tsv"   # step, start, end (empty while it runs), tab-separated
          log() { echo "$(date -u +%H:%M:%S) $*"; }
          # Values can come from the gateway or the head commit's report: a newline would add
          # variables (BASH_ENV, LD_PRELOAD) to a job holding the gateway key.
          setenv() { printf '%s=%s\n' "$1" "$(printf %s "$2" | tr -d '\r\n')" >> "$GITHUB_ENV"; }
          dur() { printf '%dm%02ds' $(($1 / 60)) $(($1 % 60)); }
          phase_end() {
            [ -s "$PHASES" ] || return 0
            awk -F'\t' -v OFS='\t' -v e="$(date +%s)" 'NR == FNR { n = NR; next } FNR == n && $3 == "" { $3 = e } { print }' \
              "$PHASES" "$PHASES" > "$PHASES.new" && mv "$PHASES.new" "$PHASES"
          }
          phase_start() { phase_end; printf '%s\t%s\t\n' "$1" "$(date +%s)" >> "$PHASES"; }
          timings() {
            local now name start end state seconds elapsed; now=$(date +%s)
            if [ -s run.json ] && jq -e '.steps | length > 0' run.json > /dev/null; then
              jq -r '"Progress: \(.progress_percent)% (\([.steps[] | select(.status == "completed")] | length)/\(.steps | length) steps completed; not a time estimate)."' run.json
              echo; echo "| Step | Status | Time | Progress |"; echo "|---|---|---|---|"
              while IFS=$'\t' read -r name state seconds detail; do
                elapsed="—"
                [ -z "$seconds" ] || elapsed=$(dur "$seconds")
                echo "| $name | $state | $elapsed | ${detail:-—} |"
              done < <(jq -r '.steps[] | [.name, .status, (.seconds // ""), (.detail // "" | gsub("[|`<>]"; ""))] | @tsv' run.json)
              return
            fi
            echo "| Step | Time |"; echo "|---|---|"
            while IFS=$'\t' read -r name start end; do
              if [ -n "$end" ]; then echo "| $name | $(dur $((end - start))) |"
              else echo "| $name | running, $(dur $((now - start))) so far |"; fi
            done < "$PHASES"
            for name in build-base build-head eval-base eval-head report; do
              grep -q "^$name"$'\t' "$PHASES" || echo "| $name | pending |"
            done
          }
          timing_line() {
            local name start end out=""
            while IFS=$'\t' read -r name start end; do
              [ -n "$end" ] && out="${out:+$out · }$name $(dur $((end - start)))"
            done < "$PHASES"
            echo "$out"
          }
          upsert() {
            [ -n "$PR" ] || return 0
            local id
            id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              -q ".[] | select(.body | startswith(\"<!-- $1 -->\")) | .id") || { echo "::warning::Could not read the pull request comments"; return 0; }
            id=${id%%$'\n'*}
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$2" > /dev/null || echo "::warning::Could not update the $1 comment"
            else
              gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$2" > /dev/null || echo "::warning::Could not post the $1 comment"
            fi
          }
          drop() {
            [ -n "$PR" ] || return 0
            local id
            for id in $(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              -q ".[] | select(.body | startswith(\"<!-- $1 -->\")) | .id" || true); do
              gh api -X DELETE "repos/$REPO/issues/comments/$id" > /dev/null || echo "::warning::Could not delete the $1 comment"
            done
          }
          # progress TITLE NOTE: where the run is, in a comment of its own (the report is posted
          # as new comments and this one deleted, so a run's comments never mix with a report).
          progress() {
            {
              echo "<!-- gold-status -->"; echo "## Gold check and speed, full index: $1"; echo
              echo "Base \`${BASE_SHA:0:7}\` → \`${HEAD_SHA:0:7}\`, run \`${RUN_ID:-not started}\`, updated $(date -u +%H:%M:%S) UTC. $2"
              echo; timings
            } > "$RUNNER_TEMP/progress.md"
            upsert gold-status "$RUNNER_TEMP/progress.md"
          }
          LIB
          . "$RUNNER_TEMP/lib.sh"
          : > "$PHASES"
          progress queued "Waiting to start the cluster run."
          # an older commit's report must not stand in for this one's while it runs
          drop gold-full; drop gold-speed
          # The cluster runs two evaluations at a time; wait for a free slot. It evaluates both
          # commits in every run and caches nothing, so speed is timed on one node.
          # Each side's index is built from that commit's chart sources, read as data, so a change
          # to them is measured by its own pull request.
          # Their builder hashes name the indexes too, so the cluster can send the run to the slot
          # that already holds them.
          for side in base head; do
            sha=$BASE_SHA; [ "$side" = head ] && sha=$HEAD_SHA
            gh api "repos/$REPO/contents/manifests/values.yaml?ref=$sha" -H 'Accept: application/vnd.github.raw' \
              > "$side-values.yaml"
            yq -o=json '.index.sources' "$side-values.yaml" > "$side-sources.json"
            jq -e 'type == "object"' "$side-sources.json" > /dev/null
            yq '.index.builderHash' "$side-values.yaml" > "$side-builder"
          done
          request=$(jq -nc --arg h "$HEAD_SHA" --arg b "$BASE_SHA" \
            --slurpfile hs head-sources.json --slurpfile bs base-sources.json \
            --rawfile hb head-builder --rawfile bb base-builder \
            '{head_sha: $h, base_sha: $b, head_sources: $hs[0], base_sources: $bs[0],
              head_builder_hash: ($hb | rtrimstr("\n") | select(test("^[0-9a-f]{16}$")) // null),
              base_builder_hash: ($bb | rtrimstr("\n") | select(test("^[0-9a-f]{16}$")) // null)}')
          deadline=$((SECONDS + 5 * 3600)); waiting=""
          while :; do
            code=$(curl -sS -m 30 -o start.json -w '%{http_code}' -X POST -H "Authorization: Bearer $KEY" \
              -d "$request" "$URL/runs")
            case "$code" in
              202) break ;;
              409) if [ "$SECONDS" -ge "$deadline" ]; then
                     log "No free slot after 5 hours"; setenv FAILED_STEP "no free slot after 5 hours"; exit 1
                   fi
                   if [ -z "$waiting" ]; then
                     waiting=1; phase_start "waiting for a free slot"
                   fi
                   # the reason goes into a public comment: plain words only
                   reason=$({ jq -r '.reason // empty' start.json 2> /dev/null || true; } | tr -cd "[:alnum:] .,'-" | cut -c1-300)
                   [ -n "$reason" ] || reason="Both slots of the cluster are busy, or the one holding this run's index is."
                   progress queued "$reason The run starts as soon as a slot can take it."
                   log "No slot can take the run yet: $reason Waited $(dur "$SECONDS") so far, retrying in 60 s"; sleep 60 ;;
              *) log "Starting the run failed: HTTP $code"; jq -r '.error // empty' start.json
                 setenv FAILED_STEP "starting the run (HTTP $code)"; exit 1 ;;
            esac
          done
          phase_end
          RUN_ID=$(jq -r .id start.json)
          setenv RUN_ID "$RUN_ID"
          log "Run $RUN_ID accepted after $(dur "$SECONDS") in the queue"
      - name: Wait for the run
        run: | # zizmor: ignore[github-env] through setenv
          set -euo pipefail
          . "$RUNNER_TEMP/lib.sh"
          # The gateway is polled every 10 s, the comment edited on a change or every 30 s: GITHUB_TOKEN
          # allows 1,000 API requests an hour, and a first index build runs for hours.
          last=""; phase=""; errors=0; began=$(date +%s); beat=$began; since=$began; posted=0
          while :; do
            if curl -sS --fail -m 30 -o run.json -H "Authorization: Bearer $KEY" "$URL/runs/$RUN_ID"; then
              errors=0
              status=$(jq -r .status run.json); phase=$(jq -r .phase run.json); now=$(date +%s); changed=""
              if [ "$status:$phase" != "$last" ]; then
                changed=1
                if [ "$phase" != "${last#*:}" ]; then
                  log "$status: $phase$([ -n "$last" ] && echo " (the step before took $(dur $((now - since))))")"
                  [ "$status" = succeeded ] || phase_start "$phase"
                  since=$now
                else
                  log "$status: $phase"
                fi
                beat=$now; last="$status:$phase"
              elif [ $((now - beat)) -ge 30 ]; then
                log "still $phase: $(dur $((now - since))) in this step, $(dur $((now - began))) in the run"; beat=$now
              fi
              case "$status" in
                succeeded|failed) break ;;
                running|queued)
                  if [ -n "$changed" ] || [ $((now - posted)) -ge 30 ]; then
                    progress "$status" "Refreshed every 30 seconds. The report is posted when the run ends, and this comment is deleted."
                    posted=$now
                  fi ;;
              esac
            else
              errors=$((errors + 1)); log "The endpoint did not answer ($errors of 60)"
              [ "$errors" -lt 60 ] || {
                setenv FAILED_STEP "the run's endpoint stopped answering"
                progress "lost contact with the run" "The run's endpoint stopped answering${phase:+ during \`$phase\`}. The run may still be going in the cluster; this job gave up after 60 failed polls, 10 minutes."
                echo "::error title=Gold run lost::The endpoint stopped answering${phase:+ during $phase}; the run may still be going in the cluster (run $RUN_ID)"
                exit 1
              }
            fi
            sleep 10
          done
          phase_end
          if [ "$status" != succeeded ]; then
            # the gateway's own words, when it knows why; it goes into a public comment: plain words only
            reason=$({ jq -r '.reason // empty' run.json 2> /dev/null || true; } | tr -cd "[:alnum:] .,:/()'-" | cut -c1-400)
            setenv FAILED_STEP "$phase${reason:+: $reason}"
            took=$(dur $(($(date +%s) - began)))
            note="The run failed in step \`$phase\` after $took.${reason:+ $reason} This is a failure of the run, not a verdict on the change: nothing here says the commit regresses. The step's own log stays in the cluster for 30 minutes after the run ends; give a maintainer the run id."
            progress "run failed in $phase" "$note"
            { echo "## Gold run failed in step \`$phase\`"; echo; [ -z "$reason" ] || { echo "$reason"; echo; }; timings; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Gold run failed::Step $phase failed after $took (run $RUN_ID)${reason:+: $reason}; no verdict for this commit"
            exit 1
          fi
          log "Done: $(timing_line)"
          jq -r .report run.json > report.md
          setenv EXIT "$(jq -r .exit run.json)"
      - name: Report
        run: | # zizmor: ignore[github-env] through setenv
          set -euo pipefail
          . "$RUNNER_TEMP/lib.sh"
          # evaluate diff puts the speed comparison between these two lines; it gets its own comment
          # and status so a slowdown is not buried in, or confused with, the correctness report.
          sed -n '/^<!-- speed: /,/^<!-- speed end -->/p' report.md > speed.md
          # Every country's pass rates by evidence are for the nightly issue; the artifact keeps them.
          sed -e '/^<!-- speed: /,/^<!-- speed end -->/d' -e '/^<!-- by-evidence -->/,/^<!-- by-evidence end -->/d' report.md > gold.md
          speed=$(sed -n 's/^<!-- speed: \([a-z]*\) -->$/\1/p' speed.md)
          headline=$(sed -n 's/^## Speed: //p' speed.md)
          setenv SPEED "${speed:-none}"
          setenv SPEED_HEADLINE "${headline:-not measured by the evaluator of this head commit}"
          # The gateway's own "pass base=N head=M" line repeats the summary table; an older evaluator's
          # headline line is dropped too.
          sed -i -e '/^<!-- headline: /d' -e '/^pass base=[0-9]* head=[0-9]* of [0-9]*/d' gold.md
          # A pass that traded a few newly failing OSM-panel locations for many newly passing ones.
          traded=$(sed -n 's/^Gate: PASS (\(.*\))\.$/\1/p' gold.md | tr -cd "[:alnum:] .,;:-")
          setenv TRADED "$traded"
          {
            echo "<!-- gold-full -->"
            echo "## Gold check, full index: $([ "$EXIT" = 1 ] && echo regressions || { [ -n "$traded" ] && echo "losses outweighed by gains"; } || echo no regressions)"
            cat gold.md
          } > comment.md
          {
            echo "<!-- gold-speed -->"
            if [ -s speed.md ]; then
              sed -e '/^<!-- speed/d' -e "s/^## Speed: /## Speed, full index: /" speed.md
              echo
              echo "Base \`${BASE_SHA:0:7}\` → \`${HEAD_SHA:0:7}\`, one after the other in one pod on the same node and index."
            else
              echo "## Speed, full index: not measured"
            fi
          } > speed-comment.md
          { cat speed-comment.md comment.md; echo; echo "Run \`$RUN_ID\`: $(timing_line)"; } > "$GITHUB_STEP_SUMMARY"
          upsert gold-speed speed-comment.md
          upsert gold-full comment.md
          drop gold-status
      - name: Keep the report
        if: always()
        run: |
          mkdir -p gold-run
          [ ! -s run.json ] || jq '{id, status, phase, exit, reason}' run.json > gold-run/run.json
          for f in report.md gold.md speed.md; do [ ! -s "$f" ] || cp "$f" "gold-run/$f"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gold-${{ needs.prepare.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: gold-run
          if-no-files-found: ignore
      - name: Set the commit statuses
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          status() {
            gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$2" -f context="$1" \
              -f description="${3:0:140}" -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" > /dev/null
          }
          state=error; description="The run did not finish${FAILED_STEP:+: failed in $FAILED_STEP}"
          if [ "$JOB_STATUS" = cancelled ]; then state=error; description="Cancelled"
          elif [ "${EXIT:-}" = 0 ] && [ -n "${TRADED:-}" ]; then state=success; description="Losses outweighed by gains: $TRADED"
          elif [ "${EXIT:-}" = 0 ]; then state=success; description="No regressions on the full index"
          elif [ "${EXIT:-}" = 1 ]; then state=failure; description="Regressions on the full index"; fi
          status gold-full "$state" "$description"
          case "${SPEED:-}" in
            pass|skip|none) status gold-speed success "$SPEED_HEADLINE" ;;
            fail) status gold-speed failure "$SPEED_HEADLINE" ;;
            *) status gold-speed "$state" "$description" ;;
          esac
      - name: Cancel the run
        if: cancelled() && env.RUN_ID != ''
        run: |
          curl -sS -m 30 -X DELETE -H "Authorization: Bearer $KEY" "$URL/runs/$RUN_ID" > /dev/null
      - name: Fail on regressions
        if: env.EXIT == '1'
        run: |
          echo "::error title=Gold regressions::Newly failing or worse cases on the full index; see the gold-full comment"
          exit 1
      - name: Fail on a slowdown
        if: ${{ !cancelled() && env.SPEED == 'fail' }}
        run: |
          echo "::error title=Speed regression::$SPEED_HEADLINE"
          exit 1

  # A snapshot refresh from source-refresh.yml merges itself once gold finds no regressions and no
  # slowdown, tested against the latest main: a branch behind main is rebased instead, and the new
  # head goes through CI and gold again. Anything else stops here: a regression leaves it open for
  # a person, as does a commit not from the workflow. An Overture release always waits for a person,
  # and so does the release that deploys a merged refresh.
  merge-refresh:
    needs: [prepare, gold]
    if: always() && needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.pr != '' && needs.gold.result != 'cancelled'
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    env:
      PR: ${{ needs.prepare.outputs.pr }}
      HEAD_SHA: ${{ needs.prepare.outputs.head }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
      BOT: 41898299+github-actions[bot]@users.noreply.github.com
      # GITHUB_TOKEN's pushes and merges start no workflows: CI, gold and release-please need the PAT.
      PAT: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge a clean snapshot refresh
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR")
          [[ $(jq -r .head.ref <<< "$pr") == source-refresh/snapshot-* ]] || exit 0
          if [[ $(jq -r '"\(.state) \(.head.sha)"' <<< "$pr") != "open $HEAD_SHA" ]]; then
            echo "::notice::#$PR is closed or has moved past ${HEAD_SHA:0:7}"; exit 0
          fi
          authors=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate -q '.[].commit.author.email' | sort -u)
          if [[ $authors != "$BOT" ]]; then
            echo "::notice::#$PR has commits not from source-refresh.yml: a person merges it"; exit 0
          fi
          # newest first, so unique_by keeps each context's latest state
          gold=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses?per_page=100" \
            -q '[.[] | select(.context == "gold-full" or .context == "gold-speed")] | unique_by(.context) | map(.state) | sort | unique | join(" ")')
          case "$gold" in
            success) ;;
            *failure*)
              gh pr comment "$PR" --body "The gold check found regressions or a slowdown, so this refresh does not merge itself. Read the gold-full and gold-speed comments, then merge or close it." > /dev/null
              exit 0 ;;
            *) echo "::notice::#$PR has no gold verdict ($gold): nothing to merge"; exit 0 ;;
          esac
          main=$(gh api "repos/$REPO/commits/main" -q .sha)
          if [[ $main != "$BASE_SHA" ]]; then
            echo "main moved to ${main:0:7} since ${BASE_SHA:0:7}: rebasing, CI and gold run again"
            GH_TOKEN=$PAT gh pr update-branch "$PR" --rebase
            exit 0
          fi
          # CI finished long before gold; wait in case a check is still running, then require every
          # check to pass or be skipped.
          timeout 30m gh pr checks "$PR" --watch --interval 60 > /dev/null || true
          failing=$(gh pr checks "$PR" --json name,bucket -q '[.[] | select(.bucket != "pass" and .bucket != "skipping") | .name] | join(", ")')
          if [[ -n $failing ]]; then
            echo "::notice::#$PR is not merged: $failing did not pass"; exit 0
          fi
          GH_TOKEN=$PAT gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA"
