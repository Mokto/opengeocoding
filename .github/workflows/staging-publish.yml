name: Staging image publish

# Runs from the default branch after staging-build.yml, with write access to the staging
# package. The publish job never checks out or runs the pull request's code: it only copies the
# images the build produced, tagged with the commit the build ran for. The images are untrusted:
# run them only in an isolated environment.
#
# Once both are pushed, the gold jobs run the suite on a full index in a private cluster: both
# commits' staging images are evaluated there on the same index, and the report comes back through
# an authenticated endpoint. No code from the pull request runs on GitHub and the cluster holds no
# GitHub credentials; these jobs only send two commit hashes. They are in this workflow, not a
# separate one, because a workflow started by this one would see this workflow's event instead of
# the build's, and a called workflow cannot read an environment's secrets.
#
# `prepare` runs without an environment and picks one: pull requests from the team use
# gold-trusted, everything else waits for a reviewer's approval in gold-approval. Both environments
# only accept workflows from main and hold the endpoint key (GOLD_GATEWAY_KEY) and URL
# (GOLD_GATEWAY_URL).
on:
  workflow_run:
    workflows: [Staging image build]
    types: [completed]

permissions: {}

env:
  REPO: ${{ github.repository }}
  IMAGE: ghcr.io/mokto/opengeocoding-staging

jobs:
  publish:
    if: github.repository == 'Mokto/opengeocoding' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: staging-image-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push both architectures and the manifest list
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image=ghcr.io/mokto/opengeocoding-staging
          echo "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          for arch in amd64 arm64; do
            skopeo copy "docker-archive:staging-image-$arch/image.tar" "docker://$image:sha-$SHA-$arch"
          done
          docker buildx imagetools create --tag "$image:sha-$SHA" "$image:sha-$SHA-amd64" "$image:sha-$SHA-arm64"

  prepare:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      head: ${{ steps.pick.outputs.head }}
      base: ${{ steps.pick.outputs.base }}
      pr: ${{ steps.pick.outputs.pr }}
      event: ${{ steps.pick.outputs.event }}
      environment: ${{ steps.pick.outputs.environment }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          status() {
            for context in gold-full gold-speed; do
              gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$1" -f context="$context" \
                -f description="$2" -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" > /dev/null
            done
          }
          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: $1"
            status success "Skipped: $1"
            exit 0
          }
          pr=""
          case "$EVENT" in
            push)
              base=$(gh api "repos/$REPO/commits/$HEAD_SHA" -q '.parents[0].sha')
              environment=gold-trusted ;;
            pull_request)
              pr=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
                   -q ".[] | select(.head.sha == \"$HEAD_SHA\") | .number")
              pr=${pr%%$'\n'*}
              [ -n "$pr" ] || skip "no open pull request for this commit"
              base=$(gh api "repos/$REPO/compare/main...$HEAD_SHA" -q '.merge_base_commit.sha')
              assoc=$(gh api "repos/$REPO/pulls/$pr" -q '.author_association')
              case "$assoc" in OWNER|MEMBER|COLLABORATOR) environment=gold-trusted ;; *) environment=gold-approval ;; esac ;;
            *) skip "unsupported event $EVENT" ;;
          esac
          for sha in "$HEAD_SHA" "$base"; do
            docker manifest inspect "$IMAGE:sha-$sha" 2>/dev/null \
              | jq -e '[.manifests[].platform.architecture] | contains(["amd64","arm64"])' > /dev/null \
              || skip "no multi-architecture staging image for ${sha:0:7}"
          done
          {
            echo "head=$HEAD_SHA"
            echo "base=$base"
            echo "pr=$pr"
            echo "environment=$environment"
            echo "event=$EVENT"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          status pending "Waiting for the full-index run ($environment)"

  gold:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    # A first build of the full index takes hours and can outlast this limit; the run then keeps
    # going in the cluster and a later run reuses its index.
    timeout-minutes: 350
    concurrency:
      group: gold-full-${{ needs.prepare.outputs.pr || needs.prepare.outputs.head }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      statuses: write
    env:
      HEAD_SHA: ${{ needs.prepare.outputs.head }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
      PR: ${{ needs.prepare.outputs.pr }}
      EVENT: ${{ needs.prepare.outputs.event }}
      URL: ${{ vars.GOLD_GATEWAY_URL }}
      KEY: ${{ secrets.GOLD_GATEWAY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the run
        run: |
          set -euo pipefail
          # The cluster runs two evaluations at a time; wait for a free slot. A commit already on main
          # (push event) has its results kept, so later pull requests find their merge base cached.
          deadline=$((SECONDS + 5 * 3600))
          while :; do
            code=$(curl -sS -m 30 -o start.json -w '%{http_code}' -X POST -H "Authorization: Bearer $KEY" \
              -d "$(jq -nc --arg h "$HEAD_SHA" --arg b "$BASE_SHA" --arg e "$EVENT" \
                   '{head_sha: $h, base_sha: $b, cache_head: ($e == "push")}')" "$URL/runs")
            case "$code" in
              202) break ;;
              409) [ "$SECONDS" -lt "$deadline" ] || { echo "No free slot after 5 hours"; exit 1; }
                   echo "Another run is active; retrying in 60 s"; sleep 60 ;;
              *) echo "Starting the run failed: HTTP $code"; jq -r '.error // empty' start.json; exit 1 ;;
            esac
          done
          echo "RUN_ID=$(jq -r .id start.json)" >> "$GITHUB_ENV"
      - name: Wait for the run
        run: |
          set -euo pipefail
          last=""; errors=0
          while :; do
            if curl -sS --fail -m 30 -o run.json -H "Authorization: Bearer $KEY" "$URL/runs/$RUN_ID"; then
              errors=0
              status=$(jq -r .status run.json); phase=$(jq -r .phase run.json)
              [ "$status:$phase" = "$last" ] || { echo "$(date -u +%H:%M) $status: $phase"; last="$status:$phase"; }
              case "$status" in succeeded|failed) break ;; esac
            else
              errors=$((errors + 1)); [ "$errors" -lt 20 ] || { echo "The endpoint stopped answering"; exit 1; }
            fi
            sleep 30
          done
          [ "$status" = succeeded ] || { echo "The run failed in step $phase"; exit 1; }
          jq -r .report run.json > report.md
          echo "EXIT=$(jq -r .exit run.json)" >> "$GITHUB_ENV"
      - name: Report
        run: |
          set -euo pipefail
          # evaluate diff puts the speed comparison between these two lines; it gets its own comment
          # and status so a slowdown is not buried in, or confused with, the correctness report.
          sed -n '/^<!-- speed: /,/^<!-- speed end -->/p' report.md > speed.md
          sed '/^<!-- speed: /,/^<!-- speed end -->/d' report.md > gold.md
          speed=$(sed -n 's/^<!-- speed: \([a-z]*\) -->$/\1/p' speed.md)
          headline=$(sed -n 's/^## Speed: //p' speed.md)
          echo "SPEED=${speed:-none}" >> "$GITHUB_ENV"
          echo "SPEED_HEADLINE=${headline:-not measured by the evaluator of this head commit}" >> "$GITHUB_ENV"
          {
            echo "<!-- gold-full -->"
            echo "## Gold check, full index: $([ "$EXIT" = 1 ] && echo regressions || echo no regressions)"
            echo
            echo "Base \`${BASE_SHA:0:7}\` → \`${HEAD_SHA:0:7}\` on the same full index, both through their staging images. Passing cases (base → head) are on the first line below; \`--relative\` leaves out must-pass cases that fail on both sides, so this shows change, not accuracy."
            echo
            cat gold.md
          } > comment.md
          {
            echo "<!-- gold-speed -->"
            if [ -s speed.md ]; then
              sed -e '/^<!-- speed/d' -e "s/^## Speed: /## Speed, full index: /" speed.md
              echo
              echo "Base \`${BASE_SHA:0:7}\` → \`${HEAD_SHA:0:7}\`, one after the other in one pod on the same node and index."
            else
              echo "## Speed, full index: not measured"
            fi
          } > speed-comment.md
          cat speed-comment.md comment.md > "$GITHUB_STEP_SUMMARY"
          upsert() {
            local id
            id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              -q ".[] | select(.body | startswith(\"<!-- $1 -->\")) | .id")
            id=${id%%$'\n'*}
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$2" > /dev/null
            else
              gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$2" > /dev/null
            fi
          }
          if [ -n "$PR" ]; then
            upsert gold-speed speed-comment.md
            upsert gold-full comment.md
          fi
      - name: Set the commit statuses
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          status() {
            gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$2" -f context="$1" \
              -f description="${3:0:140}" -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" > /dev/null
          }
          state=error; description="The run did not finish"
          if [ "$JOB_STATUS" = cancelled ]; then state=error; description="Cancelled"
          elif [ "${EXIT:-}" = 0 ]; then state=success; description="No regressions on the full index"
          elif [ "${EXIT:-}" = 1 ]; then state=failure; description="Regressions on the full index"; fi
          status gold-full "$state" "$description"
          case "${SPEED:-}" in
            pass|skip|none) status gold-speed success "$SPEED_HEADLINE" ;;
            fail) status gold-speed failure "$SPEED_HEADLINE" ;;
            *) status gold-speed "$state" "$description" ;;
          esac
      - name: Cancel the run
        if: cancelled() && env.RUN_ID != ''
        run: |
          curl -sS -m 30 -X DELETE -H "Authorization: Bearer $KEY" "$URL/runs/$RUN_ID" > /dev/null
      - name: Fail on regressions
        if: env.EXIT == '1'
        run: |
          echo "::error title=Gold regressions::Newly failing or worse cases on the full index; see the gold-full comment"
          exit 1
      - name: Fail on a slowdown
        if: ${{ !cancelled() && env.SPEED == 'fail' }}
        run: |
          echo "::error title=SearchAddress slowdown::$SPEED_HEADLINE"
          exit 1
