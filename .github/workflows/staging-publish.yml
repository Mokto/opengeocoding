name: Staging image publish

# Runs from the default branch after staging-build.yml, with write access to the staging
# package. The publish job never checks out or runs the pull request's code: it only copies the
# images the build produced, tagged with the commit the build ran for. The images are untrusted:
# run them only in an isolated environment.
#
# Once both are pushed, the gold jobs run the suite on a full index in a private cluster: both
# commits' staging images are evaluated there on the same index, and the report comes back through
# an authenticated endpoint. No code from the pull request runs on GitHub and the cluster holds no
# GitHub credentials; these jobs only send two commit hashes. They are in this workflow, not a
# separate one, because a workflow started by this one would see this workflow's event instead of
# the build's, and a called workflow cannot read an environment's secrets.
#
# `prepare` runs without an environment and picks one: pull requests from the team use
# gold-trusted, everything else waits for a reviewer's approval in gold-approval. Both environments
# only accept workflows from main and hold the endpoint key (GOLD_GATEWAY_KEY) and URL
# (GOLD_GATEWAY_URL).
on:
  workflow_run:
    workflows: [Staging image build]
    types: [completed]

permissions: {}

env:
  REPO: ${{ github.repository }}
  IMAGE: ghcr.io/mokto/opengeocoding-staging

jobs:
  publish:
    if: github.repository == 'Mokto/opengeocoding' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: staging-image-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push both architectures and the manifest list
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image=ghcr.io/mokto/opengeocoding-staging
          echo "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          for arch in amd64 arm64; do
            skopeo copy "docker-archive:staging-image-$arch/image.tar" "docker://$image:sha-$SHA-$arch"
          done
          docker buildx imagetools create --tag "$image:sha-$SHA" "$image:sha-$SHA-amd64" "$image:sha-$SHA-arm64"

  prepare:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      head: ${{ steps.pick.outputs.head }}
      base: ${{ steps.pick.outputs.base }}
      pr: ${{ steps.pick.outputs.pr }}
      environment: ${{ steps.pick.outputs.environment }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          status() {
            for context in gold-full gold-speed; do
              gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$1" -f context="$context" \
                -f description="$2" -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" > /dev/null
            done
          }
          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: $1"
            status success "Skipped: $1"
            exit 0
          }
          pr=""
          case "$EVENT" in
            push)
              # main's image is built and pushed so later pull requests have a merge base to pull
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::No gold run for a commit already on main; pull requests run their own"
              exit 0 ;;
            pull_request)
              pr=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
                   -q ".[] | select(.head.sha == \"$HEAD_SHA\") | .number")
              pr=${pr%%$'\n'*}
              [ -n "$pr" ] || skip "no open pull request for this commit"
              base=$(gh api "repos/$REPO/compare/main...$HEAD_SHA" -q '.merge_base_commit.sha')
              assoc=$(gh api "repos/$REPO/pulls/$pr" -q '.author_association')
              case "$assoc" in OWNER|MEMBER|COLLABORATOR) environment=gold-trusted ;; *) environment=gold-approval ;; esac ;;
            *) skip "unsupported event $EVENT" ;;
          esac
          for sha in "$HEAD_SHA" "$base"; do
            docker manifest inspect "$IMAGE:sha-$sha" 2>/dev/null \
              | jq -e '[.manifests[].platform.architecture] | contains(["amd64","arm64"])' > /dev/null \
              || skip "no multi-architecture staging image for ${sha:0:7}"
          done
          {
            echo "head=$HEAD_SHA"
            echo "base=$base"
            echo "pr=$pr"
            echo "environment=$environment"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          status pending "Waiting for the full-index run ($environment)"

  gold:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    # A first build of the full index takes hours and can outlast this limit; the run then keeps
    # going in the cluster and a later run reuses its index.
    timeout-minutes: 350
    concurrency:
      group: gold-full-${{ needs.prepare.outputs.pr || needs.prepare.outputs.head }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      statuses: write
    env:
      HEAD_SHA: ${{ needs.prepare.outputs.head }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
      PR: ${{ needs.prepare.outputs.pr }}
      URL: ${{ vars.GOLD_GATEWAY_URL }}
      KEY: ${{ secrets.GOLD_GATEWAY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the run
        run: |
          set -euo pipefail
          # Helpers for the steps below: timestamped log lines, a timings table of the steps seen so
          # far, and the pull request comments that show where the run is until the report replaces
          # them. Comment updates are best effort; a failed one never fails the run.
          cat > "$RUNNER_TEMP/lib.sh" <<'LIB'
          PHASES="$RUNNER_TEMP/phases.tsv"   # step, start, end (empty while it runs), tab-separated
          log() { echo "$(date -u +%H:%M:%S) $*"; }
          dur() { printf '%dm%02ds' $(($1 / 60)) $(($1 % 60)); }
          phase_end() {
            [ -s "$PHASES" ] || return 0
            awk -F'\t' -v OFS='\t' -v e="$(date +%s)" 'NR == FNR { n = NR; next } FNR == n && $3 == "" { $3 = e } { print }' \
              "$PHASES" "$PHASES" > "$PHASES.new" && mv "$PHASES.new" "$PHASES"
          }
          phase_start() { phase_end; printf '%s\t%s\t\n' "$1" "$(date +%s)" >> "$PHASES"; }
          timings() {
            local now name start end; now=$(date +%s)
            echo "| Step | Time |"; echo "|---|---|"
            while IFS=$'\t' read -r name start end; do
              if [ -n "$end" ]; then echo "| $name | $(dur $((end - start))) |"
              else echo "| $name | running, $(dur $((now - start))) so far |"; fi
            done < "$PHASES"
          }
          timing_line() {
            local name start end out=""
            while IFS=$'\t' read -r name start end; do
              [ -n "$end" ] && out="${out:+$out · }$name $(dur $((end - start)))"
            done < "$PHASES"
            echo "$out"
          }
          upsert() {
            [ -n "$PR" ] || return 0
            local id
            id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              -q ".[] | select(.body | startswith(\"<!-- $1 -->\")) | .id") || { echo "::warning::Could not read the pull request comments"; return 0; }
            id=${id%%$'\n'*}
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$2" > /dev/null || echo "::warning::Could not update the $1 comment"
            else
              gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$2" > /dev/null || echo "::warning::Could not post the $1 comment"
            fi
          }
          # progress TITLE SPEED_TITLE NOTE: replaces both comments, so an older commit's report
          # never stands in for this one's.
          progress() {
            {
              echo "<!-- gold-full -->"; echo "## Gold check, full index: $1"; echo
              echo "Base \`${BASE_SHA:0:7}\` → \`${HEAD_SHA:0:7}\`, run \`${RUN_ID:-not started}\`, updated $(date -u +%H:%M) UTC. $3"
              echo; timings
            } > "$RUNNER_TEMP/progress.md"
            { echo "<!-- gold-speed -->"; echo "## Speed, full index: $2"; } > "$RUNNER_TEMP/progress-speed.md"
            upsert gold-speed "$RUNNER_TEMP/progress-speed.md"
            upsert gold-full "$RUNNER_TEMP/progress.md"
          }
          LIB
          . "$RUNNER_TEMP/lib.sh"
          : > "$PHASES"
          # The cluster runs two evaluations at a time; wait for a free slot. It evaluates both
          # commits in every run and caches nothing, so speed is timed on one node.
          deadline=$((SECONDS + 5 * 3600)); waiting=""
          while :; do
            code=$(curl -sS -m 30 -o start.json -w '%{http_code}' -X POST -H "Authorization: Bearer $KEY" \
              -d "$(jq -nc --arg h "$HEAD_SHA" --arg b "$BASE_SHA" '{head_sha: $h, base_sha: $b}')" "$URL/runs")
            case "$code" in
              202) break ;;
              409) if [ "$SECONDS" -ge "$deadline" ]; then
                     log "No free slot after 5 hours"; echo "FAILED_STEP=no free slot after 5 hours" >> "$GITHUB_ENV"; exit 1
                   fi
                   if [ -z "$waiting" ]; then
                     waiting=1; phase_start "waiting for a free slot"
                     progress queued "waiting for the run" "Both slots of the cluster are busy; the run starts when one is free."
                   fi
                   log "Both slots are busy; waited $(dur "$SECONDS") so far, retrying in 60 s"; sleep 60 ;;
              *) log "Starting the run failed: HTTP $code"; jq -r '.error // empty' start.json
                 echo "FAILED_STEP=starting the run (HTTP $code)" >> "$GITHUB_ENV"; exit 1 ;;
            esac
          done
          phase_end
          RUN_ID=$(jq -r .id start.json)
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          log "Run $RUN_ID accepted after $(dur "$SECONDS") in the queue"
      - name: Wait for the run
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/lib.sh"
          last=""; phase=""; errors=0; began=$(date +%s); beat=$began; since=$began
          while :; do
            if curl -sS --fail -m 30 -o run.json -H "Authorization: Bearer $KEY" "$URL/runs/$RUN_ID"; then
              errors=0
              status=$(jq -r .status run.json); phase=$(jq -r .phase run.json); now=$(date +%s)
              if [ "$status:$phase" != "$last" ]; then
                if [ "$phase" != "${last#*:}" ]; then
                  log "$status: $phase$([ -n "$last" ] && echo " (the step before took $(dur $((now - since))))")"
                  [ "$status" = succeeded ] || phase_start "$phase"
                  since=$now
                  case "$status" in running|queued) progress running "waiting for the run" "The report replaces this comment when the run ends." ;; esac
                else
                  log "$status: $phase"
                fi
                beat=$now; last="$status:$phase"
              elif [ $((now - beat)) -ge 300 ]; then
                log "still $phase: $(dur $((now - since))) in this step, $(dur $((now - began))) in the run"; beat=$now
              fi
              case "$status" in succeeded|failed) break ;; esac
            else
              errors=$((errors + 1)); log "The endpoint did not answer ($errors of 20)"
              [ "$errors" -lt 20 ] || {
                echo "FAILED_STEP=the run's endpoint stopped answering" >> "$GITHUB_ENV"
                progress "lost contact with the run" "no result" "The run's endpoint stopped answering${phase:+ during \`$phase\`}. The run may still be going in the cluster; this job gave up after 20 failed polls."
                echo "::error title=Gold run lost::The endpoint stopped answering${phase:+ during $phase}; the run may still be going in the cluster (run $RUN_ID)"
                exit 1
              }
            fi
            sleep 30
          done
          phase_end
          if [ "$status" != succeeded ]; then
            echo "FAILED_STEP=$phase" >> "$GITHUB_ENV"
            took=$(dur $(($(date +%s) - began)))
            note="The run failed in step \`$phase\` after $took. This is a failure of the run, not a verdict on the change: nothing here says the commit regresses. The step's own log stays in the cluster; give a maintainer the run id."
            progress "run failed in $phase" "no result, the run failed" "$note"
            { echo "## Gold run failed in step \`$phase\`"; echo; timings; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Gold run failed::Step $phase failed after $took (run $RUN_ID); no verdict for this commit"
            exit 1
          fi
          log "Done: $(timing_line)"
          jq -r .report run.json > report.md
          echo "EXIT=$(jq -r .exit run.json)" >> "$GITHUB_ENV"
      - name: Report
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/lib.sh"
          # evaluate diff puts the speed comparison between these two lines; it gets its own comment
          # and status so a slowdown is not buried in, or confused with, the correctness report.
          sed -n '/^<!-- speed: /,/^<!-- speed end -->/p' report.md > speed.md
          sed '/^<!-- speed: /,/^<!-- speed end -->/d' report.md > gold.md
          speed=$(sed -n 's/^<!-- speed: \([a-z]*\) -->$/\1/p' speed.md)
          headline=$(sed -n 's/^## Speed: //p' speed.md)
          echo "SPEED=${speed:-none}" >> "$GITHUB_ENV"
          echo "SPEED_HEADLINE=${headline:-not measured by the evaluator of this head commit}" >> "$GITHUB_ENV"
          # evaluate diff's headline line (what passes on each side, per RPC) goes into the title; the
          # gateway's own "pass base=N head=M" line repeats part of it.
          summary=$(sed -n 's/^<!-- headline: \(.*\) -->$/\1/p' gold.md | head -1)
          sed -i -e '/^<!-- headline: /d' -e '/^pass base=[0-9]* head=[0-9]* of [0-9]*/d' gold.md
          {
            echo "<!-- gold-full -->"
            echo "## Gold check, full index: $([ "$EXIT" = 1 ] && echo regressions || echo no regressions)${summary:+ — $summary}"
            cat gold.md
            echo
            echo "Run \`$RUN_ID\`: $(timing_line)"
          } > comment.md
          {
            echo "<!-- gold-speed -->"
            if [ -s speed.md ]; then
              sed -e '/^<!-- speed/d' -e "s/^## Speed: /## Speed, full index: /" speed.md
              echo
              echo "Base \`${BASE_SHA:0:7}\` → \`${HEAD_SHA:0:7}\`, one after the other in one pod on the same node and index."
            else
              echo "## Speed, full index: not measured"
            fi
          } > speed-comment.md
          cat speed-comment.md comment.md > "$GITHUB_STEP_SUMMARY"
          upsert gold-speed speed-comment.md
          upsert gold-full comment.md
      - name: Keep the report
        if: always()
        run: |
          mkdir -p gold-run
          [ ! -s run.json ] || jq '{id, status, phase, exit}' run.json > gold-run/run.json
          for f in report.md gold.md speed.md; do [ ! -s "$f" ] || cp "$f" "gold-run/$f"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gold-${{ needs.prepare.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: gold-run
          if-no-files-found: ignore
      - name: Set the commit statuses
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          status() {
            gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$2" -f context="$1" \
              -f description="${3:0:140}" -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" > /dev/null
          }
          state=error; description="The run did not finish${FAILED_STEP:+: failed in $FAILED_STEP}"
          if [ "$JOB_STATUS" = cancelled ]; then state=error; description="Cancelled"
          elif [ "${EXIT:-}" = 0 ]; then state=success; description="No regressions on the full index"
          elif [ "${EXIT:-}" = 1 ]; then state=failure; description="Regressions on the full index"; fi
          status gold-full "$state" "$description"
          case "${SPEED:-}" in
            pass|skip|none) status gold-speed success "$SPEED_HEADLINE" ;;
            fail) status gold-speed failure "$SPEED_HEADLINE" ;;
            *) status gold-speed "$state" "$description" ;;
          esac
      - name: Cancel the run
        if: cancelled() && env.RUN_ID != ''
        run: |
          curl -sS -m 30 -X DELETE -H "Authorization: Bearer $KEY" "$URL/runs/$RUN_ID" > /dev/null
      - name: Fail on regressions
        if: env.EXIT == '1'
        run: |
          echo "::error title=Gold regressions::Newly failing or worse cases on the full index; see the gold-full comment"
          exit 1
      - name: Fail on a slowdown
        if: ${{ !cancelled() && env.SPEED == 'fail' }}
        run: |
          echo "::error title=Speed regression::$SPEED_HEADLINE"
          exit 1
