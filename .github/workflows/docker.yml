name: Publish Docker image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.repository == 'Mokto/geolocation'
    needs: checks
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      target: runtime
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      meta-images: ghcr.io/mokto/geolocation
      meta-flavor: latest=false
      meta-tags: |
        type=sha,prefix=sha-,format=long
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      set-meta-labels: true
      meta-labels: |
        org.opencontainers.image.licenses=FSL-1.1-Apache-2.0
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify both architectures in the published manifest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "ghcr.io/mokto/geolocation@$DIGEST" --raw |
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | contains(["linux/amd64", "linux/arm64"])'
