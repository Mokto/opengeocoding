name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.repository == 'Mokto/opengeocoding'
    needs: checks
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      target: runtime
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      meta-images: ghcr.io/mokto/opengeocoding
      meta-flavor: latest=false
      meta-tags: |
        type=sha,prefix=sha-,format=long
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      set-meta-labels: true
      meta-labels: |
        org.opencontainers.image.licenses=LicenseRef-PolyForm-Shield-1.0.0
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify both architectures in the published manifest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "ghcr.io/mokto/opengeocoding@$DIGEST" --raw |
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | contains(["linux/amd64", "linux/arm64"])'

  chart:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Install Helm
        run: |
          curl -fsSLo helm.tgz https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Publish the chart, pinned to this commit's image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          base="$(sed -n 's/^version: //p' manifests/Chart.yaml)"
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}"; app="$version" ;;
            *) version="$base-g${GITHUB_SHA::12}"; app="sha-$GITHUB_SHA" ;;
          esac
          helm package manifests --version "$version" --app-version "$app"
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "opengeocoding-$version.tgz" oci://ghcr.io/mokto/charts
