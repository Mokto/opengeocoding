name: Publish Docker image

on:
  push:
    # main builds without pushing, to keep the default-branch build cache warm for release tags.
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: $/.github/workflows/ci.yml

  publish:
    if: github.repository == 'Mokto/opengeocoding'
    needs: checks
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ github.ref_type == 'tag' }}
      target: runtime
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      meta-images: ghcr.io/mokto/opengeocoding
      meta-flavor: latest=false
      meta-tags: |
        type=semver,pattern={{version}}
        type=raw,value=latest
      set-meta-labels: true
      meta-labels: |
        org.opencontainers.image.licenses=LicenseRef-PolyForm-Shield-1.0.0
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  verify:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify both architectures in the published manifest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "ghcr.io/mokto/opengeocoding@$DIGEST" --raw |
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | contains(["linux/amd64", "linux/arm64"])'

  attest:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      attestations: write
      id-token: write
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/mokto/opengeocoding
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true
          # Storage records are an organization API; this repository belongs to a user.
          create-storage-record: false

  chart:
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        run: |
          curl -fsSLo helm.tgz https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Publish the chart, pinned to this release's image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          helm package manifests --version "$version" --app-version "$version"
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "opengeocoding-$version.tgz" oci://ghcr.io/mokto/charts

  deploy:
    needs: chart
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      # DISPATCH_TARGET is the full workflow_dispatch URL of the deploying workflow, DISPATCH_TOKEN a token for it.
      - name: Dispatch the deployment of this release's chart
        env:
          TARGET: ${{ secrets.DISPATCH_TARGET }}
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$TARGET" ] || [ -z "$TOKEN" ]; then
            echo "::notice::DISPATCH_TARGET or DISPATCH_TOKEN is not set; skipping the deployment dispatch"
            exit 0
          fi
          version="${GITHUB_REF#refs/tags/v}"
          curl -fsS --retry 3 -X POST "$TARGET" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"$version\"}}"
