name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    # The union of the benchmarks' files below; the select step narrows it to the benchmarks each
    # change touches.
    paths:
      - benches/**
      - src/matching.rs
      - src/resolver.rs
      - src/index/mod.rs
      - src/index/parse.rs
      - src/index/country/**
      - src/index/schema.rs
      - src/index/canon.rs
      - data/**
      - tests/addresses.tsv
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/codspeed.yml
      - .github/actions/libpostal-env/**
  # runs every benchmark, to backfill a baseline
  workflow_dispatch:

permissions:
  contents: read
  # OIDC authentication with CodSpeed
  id-token: write

env:
  LIBPOSTAL_COMMIT: 25099c506612b34b23b1bfe286ca6321fcf06f35
  LIBPOSTAL_PREFIX: /home/runner/libpostal
  RUSTFLAGS: -L native=/home/runner/libpostal/lib
  LD_LIBRARY_PATH: /home/runner/libpostal/lib
  LIBPOSTAL_MODELS: /home/runner/models

jobs:
  benchmarks:
    # Release PRs only bump versions in Cargo.toml and Cargo.lock.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pull requests run only the benchmarks whose files they change. Pushes to main and manual
      # runs run all of them, so every main commit is a complete baseline for the next pull request.
      - name: Select the benchmarks
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(if [ -n "$BASE" ]; then git diff --name-only "$BASE...HEAD"; else echo all; fi)
          shared='^(all|Cargo\.(toml|lock)|build\.rs|\.github/workflows/codspeed\.yml)$'
          picked=()
          pick() { echo "$changed" | grep -Eq "$shared|$2" && picked+=("$1") || true; }
          pick index '^(src/index/(schema|canon)\.rs|benches/index\.rs)$'
          pick matching '^(src/(matching|resolver)\.rs|src/index/country/.*|data/.*|benches/matching\.rs)$'
          pick resolve '^(src/index/(mod|parse)\.rs|src/index/country/.*|benches/resolve\.rs|tests/addresses\.tsv|\.github/actions/libpostal-env/.*)$'
          echo "benches=${picked[*]}" >> "$GITHUB_OUTPUT"
          echo "Benchmarks to run: ${picked[*]:-none}"
      - if: steps.select.outputs.benches != ''
        uses: $/.github/actions/libpostal-env
        with:
          models: ${{ contains(steps.select.outputs.benches, 'resolve') }}
      - if: steps.select.outputs.benches != ''
        name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      # Caches dependencies, build output and the binaries installed below.
      - if: steps.select.outputs.benches != ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: steps.select.outputs.benches != ''
        name: Install Buf and cargo-codspeed
        run: |
          curl -fsSL --retry 3 "https://github.com/bufbuild/buf/releases/download/v1.68.1/buf-Linux-x86_64" -o "$HOME/.cargo/bin/buf"
          chmod +x "$HOME/.cargo/bin/buf"
          cargo install cargo-codspeed --locked --version 5.0.2
      # Builds them all (the build replaces earlier ones); only the selected ones run.
      - if: steps.select.outputs.benches != ''
        name: Build the benchmarks
        run: cargo codspeed build
      - if: steps.select.outputs.benches != ''
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: simulation
          run: |
            for bench in ${{ steps.select.outputs.benches }}; do
              cargo codspeed run --bench "$bench"
            done
