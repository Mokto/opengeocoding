name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - src/**
      - benches/**
      - data/**
      - proto/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/codspeed.yml
      - .github/actions/bench-env/**
  # lets CodSpeed backfill a baseline
  workflow_dispatch:

permissions:
  contents: read
  # OIDC authentication with CodSpeed
  id-token: write

env:
  LIBPOSTAL_COMMIT: 25099c506612b34b23b1bfe286ca6321fcf06f35
  LIBPOSTAL_PREFIX: /home/runner/libpostal
  RUSTFLAGS: -L native=/home/runner/libpostal/lib
  LD_LIBRARY_PATH: /home/runner/libpostal/lib
  LIBPOSTAL_MODELS: /home/runner/models
  INDEX_DIR: /home/runner/fixture/index

jobs:
  benchmarks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      # benches/suggest.rs and reverse.rs need an index, resolve.rs the models; without
      # BENCH_FIXTURE_URL they are skipped.
      # The fixture is described in benches/fixture/README.md.
      - uses: ./.github/actions/bench-env
        with:
          fixture-url: ${{ vars.BENCH_FIXTURE_URL }}
          fixture-sha256: ${{ vars.BENCH_FIXTURE_SHA256 }}
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      # Caches dependencies, build output and the binaries installed below.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Buf and cargo-codspeed
        run: |
          curl -fsSL --retry 3 "https://github.com/bufbuild/buf/releases/download/v1.68.1/buf-Linux-x86_64" -o "$HOME/.cargo/bin/buf"
          chmod +x "$HOME/.cargo/bin/buf"
          cargo install cargo-codspeed --locked --version 5.0.2
      - name: Build the benchmarks
        run: cargo codspeed build
      - uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: simulation
          run: cargo codspeed run
