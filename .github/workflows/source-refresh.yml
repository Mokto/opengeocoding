name: Source refresh

# Opens a pull request moving the index to Overture's latest release, with a new snapshot label
# so OSM, OpenAddresses and GeoNames are fetched again too. Without a new Overture release, it
# opens one for a new snapshot label alone once the current one is 30 days old and one of those
# sources changed since. Closing the pull request declines it: an Overture release is not
# proposed again, a snapshot refresh not for another 30 days.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-refresh

jobs:
  refresh:
    if: github.repository == 'Mokto/opengeocoding'
    runs-on: ubuntu-24.04
    steps:
      # A PAT, not GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN does not trigger CI or
      # the gold gate.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Propose new source data
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          MAX_AGE_DAYS: 30
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          values=manifests/values.yaml
          field() { sed -n "s/^    $1: \"\(.*\)\"\$/\1/p" "$values"; }
          modified() {
            local lm
            lm=$(curl -fsSIL --retry 3 "$1" | sed -n 's/^last-modified: //Ip' | tail -1 | tr -d '\r')
            [[ -n $lm ]] || { echo "no Last-Modified for $1" >&2; return 1; }
            date -u -d "$lm" +%F
          }
          today=$(date -u +%F)
          current=$(field overtureRelease)
          snapshot=$(field snapshot)
          [[ -n $current && -n $snapshot ]] || { echo "overtureRelease or snapshot not found in $values"; exit 1; }

          latest=$(curl -fsS --retry 3 https://stac.overturemaps.org/catalog.json | jq -r .latest)
          [[ $latest =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]] || { echo "unexpected release: $latest"; exit 1; }
          if [[ $latest != "$current" && $(printf '%s\n' "$current" "$latest" | sort -V | tail -1) == "$latest" ]]; then
            branch="source-refresh/$latest"
            if [[ $(gh pr list --head "$branch" --state all --json number --jq length) != 0 ]]; then
              echo "$latest already proposed"
              exit 0
            fi
            title="fix: index Overture release $latest"
            changes="- Overture: \`$current\` → \`$latest\`"$'\n'
          else
            since=$snapshot
            [[ $since =~ ^[0-9]{4}-[0-9]{2}$ ]] && since+=-01
            age=$(( ($(date -u +%s) - $(date -u -d "$since" +%s)) / 86400 ))
            if (( age < MAX_AGE_DAYS )); then
              echo "Overture $current is the latest; snapshot $snapshot is $age days old"
              exit 0
            fi
            cutoff=$(date -u -d "$MAX_AGE_DAYS days ago" +%F)
            recent=$(gh pr list --state all --limit 100 --json headRefName,createdAt \
              --jq "[.[] | select((.headRefName | startswith(\"source-refresh/\")) and .createdAt >= \"$cutoff\")] | length")
            if [[ $recent != 0 ]]; then
              echo "a source refresh was proposed in the last $MAX_AGE_DAYS days"
              exit 0
            fi
            changes=""
            # Geofabrik rebuilds every extract together, so one stands for all.
            osm=$(yq '.index.sources.osm[0] // ""' "$values")
            if [[ -n $osm ]]; then
              pbf=$(curl -fsS --retry 3 https://download.geofabrik.de/index-v1-nogeom.json \
                | jq -r --arg id "$osm" '.features[].properties | select(.id == $id) | .urls.pbf')
              osm_date=$(modified "$pbf")
              [[ $osm_date > $since ]] && changes+="- OSM (Geofabrik): extracts rebuilt $osm_date"$'\n'
            fi
            geonames_date=$(modified https://download.geonames.org/export/zip/allCountries.zip)
            [[ $geonames_date > $since ]] && changes+="- GeoNames: exports regenerated $geonames_date"$'\n'
            oa=$(curl -fsS --retry 3 https://batch.openaddresses.io/api/data \
              | jq --arg d "$since" '[.[] | select(.layer == "addresses" and .updated > $d)] | length')
            (( oa > 0 )) && changes+="- OpenAddresses: $oa address layers updated since $since"$'\n'
            if [[ -z $changes ]]; then
              echo "no source changed since $since"
              exit 0
            fi
            branch="source-refresh/snapshot-$today"
            title="fix: refresh index sources (snapshot $today)"
          fi

          sed -i -e "s/^    overtureRelease: \".*\"$/    overtureRelease: \"$latest\"/" \
            -e "s/^    snapshot: \".*\"$/    snapshot: \"$today\"/" "$values"
          [[ $(field overtureRelease) == "$latest" && $(field snapshot) == "$today" ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title"
          git push origin "$branch"
          gh pr create --head "$branch" --base main --title "$title" --body "Sets \`index.sources.snapshot\` from \`$snapshot\` to \`$today\`, so OSM, OpenAddresses and GeoNames are fetched again, and \`index.sources.overtureRelease\` to \`$latest\`.

          $changes
          This names a new index; once released, the leader builds it while the current pods keep serving the old one. New source data can change answers like a code change can: read the gold quality and speed comments before merging, and close this pull request to decline it."
