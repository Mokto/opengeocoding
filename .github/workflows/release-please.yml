name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    if: github.repository == 'Mokto/opengeocoding'
    runs-on: ubuntu-24.04
    steps:
      # A PAT, not GITHUB_TOKEN: tags and PRs created with GITHUB_TOKEN do not trigger
      # docker.yml (v* tags) or CI (the release PR).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
